<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Example - Task Management App</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stomp-websocket@2.3.4-next/lib/stomp.min.js"></script>
    <script src="/js/websocket-client.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .card { border: 1px solid #ddd; border-radius: 4px; padding: 15px; margin-bottom: 10px; }
        .notification { background-color: #f8f9fa; padding: 10px; margin: 10px 0; border-left: 4px solid #28a745; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; }
        pre { background-color: #f5f5f5; padding: 10px; border-radius: 4px; overflow: auto; }
    </style>
</head>
<body>
    <h1>WebSocket Integration Example</h1>

    <div class="card">
        <h2>Connection</h2>
        <button onclick="window.websocketClient.connect(onConnect)">Connect</button>
        <button onclick="window.websocketClient.disconnect()">Disconnect</button>
        <div id="connection-status">Status: Disconnected</div>
    </div>

    <div class="card">
        <h2>Subscriptions</h2>
        <button onclick="subscribeToAllTasksHandler()">Subscribe to All Tasks</button>
        <button onclick="subscribeToAllWorkspacesHandler()">Subscribe to All Workspaces</button>
        <div>
            <label>Task ID:</label>
            <input type="number" id="task-id" min="1" />
            <button onclick="subscribeToTaskHandler()">Subscribe</button>
        </div>
        <div>
            <label>Workspace ID:</label>
            <input type="number" id="workspace-id" min="1" />
            <button onclick="subscribeToWorkspaceHandler()">Subscribe</button>
            <button onclick="subscribeToWorkspaceTasksHandler()">Subscribe to Tasks</button>
        </div>
    </div>

    <div class="card">
        <h2>Notifications</h2>
        <div id="notifications">
            <div class="notification">Connect to start receiving notifications...</div>
        </div>
    </div>

    <script>
        function onConnect() {
            document.getElementById('connection-status').textContent = 'Status: Connected';
            addNotification('Connected to WebSocket server');
        }

        function addNotification(message, data) {
            const notificationDiv = document.createElement('div');
            notificationDiv.className = 'notification';

            let content = message;
            if (data) {
                content += '<br><pre>' + JSON.stringify(data, null, 2) + '</pre>';
            }

            notificationDiv.innerHTML = content;
            document.getElementById('notifications').prepend(notificationDiv);
        }

        function handleEvent(event) {
            addNotification(`Event received: ${event.eventType}`, event.payload);
        }

        function subscribeToAllTasksHandler() {
            if (window.websocketClient.subscribeToAllTasks(handleEvent)) {
                addNotification('Subscribed to all tasks');
            }
        }

        function subscribeToTaskHandler() {
            const taskId = document.getElementById('task-id').value;
            if (!taskId) {
                alert('Please enter a Task ID');
                return;
            }

            if (window.websocketClient.subscribeToTask(taskId, handleEvent)) {
                addNotification(`Subscribed to task #${taskId}`);
            }
        }

        function subscribeToAllWorkspacesHandler() {
            if (window.websocketClient.subscribeToAllWorkspaces(handleEvent)) {
                addNotification('Subscribed to all workspaces');
            }
        }

        function subscribeToWorkspaceHandler() {
            const workspaceId = document.getElementById('workspace-id').value;
            if (!workspaceId) {
                alert('Please enter a Workspace ID');
                return;
            }

            if (window.websocketClient.subscribeToWorkspace(workspaceId, handleEvent)) {
                addNotification(`Subscribed to workspace #${workspaceId}`);
            }
        }

        function subscribeToWorkspaceTasksHandler() {
            const workspaceId = document.getElementById('workspace-id').value;
            if (!workspaceId) {
                alert('Please enter a Workspace ID');
                return;
            }

            if (window.websocketClient.subscribeToWorkspaceTasks(workspaceId, handleEvent)) {
                addNotification(`Subscribed to tasks in workspace #${workspaceId}`);
            }
        }
    </script>
</body>
</html>
